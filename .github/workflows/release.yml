name: Release

# Publishes signed APKs (one per ABI plus a universal one) and an AAB when a version tag is pushed.
# Needs these repository secrets:
#   SQUEEZE_KEYSTORE_BASE64    the release keystore, base64 encoded (base64 -w0 release.jks)
#   SQUEEZE_KEYSTORE_PASSWORD  keystore password
#   SQUEEZE_KEY_ALIAS          key alias
#   SQUEEZE_KEY_PASSWORD       key password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $version in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SQUEEZE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SQUEEZE_KEYSTORE_BASE64 is not set" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build signed release
        env:
          SQUEEZE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SQUEEZE_KEYSTORE_PASSWORD: ${{ secrets.SQUEEZE_KEYSTORE_PASSWORD }}
          SQUEEZE_KEY_ALIAS: ${{ secrets.SQUEEZE_KEY_ALIAS }}
          SQUEEZE_KEY_PASSWORD: ${{ secrets.SQUEEZE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify the APKs are signed
        run: |
          sdk=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do "$sdk/apksigner" verify --print-certs "$apk" | head -3; done

      - name: Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Squeeze ${GITHUB_REF_NAME}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts).txt"
